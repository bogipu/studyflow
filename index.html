<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAF5F7">
  <title>Tanulókártyák</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%23F3D7E5%22%2F%3E%3Ctext%20x%3D%2250%22%20y%3D%2252%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22central%22%20font-size%3D%2272%22%3E%F0%9F%8E%80%3C%2Ftext%3E%3C%2Fsvg%3E">
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#5D536B;background:#FAF5F7;font-synthesis:none}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#FAF5F7;color:#5D536B}
    main{max-width:720px;margin:auto;padding:32px 18px 50px}
    h1{margin:0 0 24px;font-size:2rem;letter-spacing:-.04em;color:#5D536B}
    .topnav{display:flex;justify-content:flex-end;margin:-12px 0 16px}
    .topnav a{display:inline-flex;align-items:center;gap:6px;padding:10px 15px;border-radius:14px;background:#EAE3F2;color:#5D536B;text-decoration:none;font-weight:650}
    .topnav a:hover{background:#E5DFF3}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
    select,button{font:inherit;border-radius:14px;padding:12px 14px}
    select{background:#FFFDFE;color:#5D536B;border:1px solid #D8CEE6;flex:1;min-width:180px;cursor:pointer;appearance:auto}
    button{border:0;background:#A89BC7;color:#332A40;cursor:pointer;font-weight:650;transition:filter .2s,transform .2s}
    button:hover{filter:brightness(.97)}button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:not-allowed}
    .secondary{background:#EAE3F2;color:#5D536B}
    .order-toggle{display:inline-flex;align-items:center;gap:9px;padding:10px 12px;color:#5D536B;cursor:pointer;white-space:nowrap}
    .order-toggle input{width:19px;height:19px;accent-color:#A89BC7;cursor:pointer;margin:0}
    .stats{color:#746A80;margin:10px 0 18px;min-height:24px}
    .card-scene{width:100%;height:310px;perspective:1200px;touch-action:pan-y;user-select:none;cursor:pointer;outline:none}
    .card-scene:focus-visible{outline:3px solid #A89BC7;outline-offset:5px;border-radius:26px}
    .card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
    .card-scene.is-flipped .card-inner{transform:rotateY(180deg)}
    .card-face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;border:1px solid #E6CDD4;border-radius:26px;box-shadow:0 16px 38px #5D536B1C;backface-visibility:hidden;-webkit-backface-visibility:hidden}
    .card-front{background:var(--card-front,#F1DFE2);border-color:var(--card-front-border,#E6CDD4)}
    .card-back{background:var(--card-back,#E5DFF3);border-color:var(--card-back-border,#D5C9E7)}
    .card-back{transform:rotateY(180deg)}
    .word{display:block;width:100%;max-width:100%;font-size:2.8rem;font-weight:700;line-height:1.25;overflow-wrap:anywhere;white-space:pre-wrap;color:#5D536B}
    .card-back .word{color:#5D536B}
    .actions{display:flex;gap:12px;margin-top:18px}.actions button{flex:1;min-height:54px}
    .retry{background:#F2E4E7;color:#5D536B}
    .learn{background:#DDEAF1;color:#5D536B}
    .message{padding:28px 20px;border-radius:18px;background:#F4EBF1;line-height:1.6}
    .message.error{border:1px solid #C49AAA}
    .round-summary{padding:28px 22px;border-radius:22px;background:#F4EBF1;text-align:center}
    .round-summary h2{margin:0 0 14px;font-size:1.45rem;color:#5D536B}
    .round-counts{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0 22px}
    .round-count{padding:16px 22px;border-radius:16px;background:#FFFDFE;min-width:120px}
    .round-count strong{display:block;font-size:2rem}
    .round-options{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    .round-options button{flex:1;min-width:190px;min-height:54px}
    .round-options .missed{background:#F2E4E7;color:#5D536B}
    .round-options .all{background:#DDEAF1;color:#5D536B}
    .hidden{display:none!important}
    @media(max-width:460px){main{padding:20px 14px}.card-scene{height:270px}.actions{gap:8px}.actions button{padding:12px 8px;font-size:.92rem}}
    @media(prefers-reduced-motion:reduce){.card-inner{transition:none}}
  </style>
</head>
<body>
<main>
  <h1>Tanulókártyák</h1>
  <nav class="topnav"><a href="statisztika.html">📊 Statisztika</a></nav>
  <div class="toolbar">
    <select id="category" aria-label="Munkalap választása" disabled><option>Betöltés…</option></select>
    <label class="order-toggle"><input id="order" type="checkbox"> Véletlenszerű sorrend</label>
    <button id="reload" class="secondary" type="button">Frissítés</button>
    <button id="reset" class="secondary" type="button" disabled>Újrakezdés</button>
  </div>
  <div id="cloudPanel" style="margin:0 0 14px;padding:12px 14px;border:1px solid #EADFE9;border-radius:14px;background:#FFFDFE;font-size:.9rem">
    <label for="syncCode"><strong>☁️ Online statisztika – saját kód</strong></label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><input id="syncCode" type="text" autocomplete="off" spellcheck="false" placeholder="Írj be legalább 2 karaktert" style="flex:1;min-width:170px;padding:10px;border:1px solid #D8CEE6;border-radius:10px"><button id="saveSync" class="secondary" type="button">Kód mentése</button></div>
    <div id="syncStatus" aria-live="polite" style="margin-top:7px;color:#746A80">A kódot a statisztikaoldal is használja. Másik eszközön ugyanazt add meg.</div>
  </div>
  <div id="stats" class="stats" aria-live="polite"></div>
  <div id="message" class="message">Excel-adatok betöltése…</div>
  <div id="roundSummary" class="round-summary hidden" aria-live="polite">
    <h2>Végigértél a listán! 🎉</h2>
    <div class="round-counts">
      <div class="round-count">Tudtam<strong id="knownCount">0</strong></div>
      <div class="round-count">Nem tudtam<strong id="missedCount">0</strong></div>
    </div>
    <div class="round-options">
      <button id="retryMissed" class="missed" type="button">Csak a nem tudottakat tanulom tovább</button>
      <button id="restartAll" class="all" type="button">Elölről kezdem az egészet</button>
    </div>
  </div>
  <div id="study" class="hidden">
    <div id="card" class="card-scene" role="button" tabindex="0" aria-label="Kártya megfordítása" aria-pressed="false">
      <div class="card-inner">
        <div class="card-face card-front"><span id="frontWord" class="word"></span></div>
        <div class="card-face card-back"><span id="backWord" class="word"></span></div>
      </div>
    </div>
    <div class="actions">
      <button id="again" class="retry" type="button">← Újra kérem</button>
      <button id="learned" class="learn" type="button">Megtanultam →</button>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
'use strict';
// Az Excel fájl neve a GitHub-tárhely gyökérkönyvtárában.
const EXCEL_FILE = 'studyflow.xlsx';
const STORAGE_PREFIX = 'studyflow-v2:';
const HISTORY_KEY = 'studyflow-daily-history-v1';
const SYNC_KEY = 'studyflow-cloud-code-v1';
const QUEUE_KEY = 'studyflow-cloud-pending-v1';
function syncCode() { return (localStorage.getItem(SYNC_KEY) || '').trim(); }
function updateSyncStatus(message) { $('syncStatus').textContent = message || (syncCode() ? '☁️ Online mentés bekapcsolva ezen az eszközön.' : 'Adj meg egy egyedi kódot az online mentéshez.'); }
$('syncCode').value = syncCode();
updateSyncStatus();
$('saveSync').addEventListener('click', () => {
  const code = $('syncCode').value.trim();
  if (code.length < 2 || code.length > 128) { updateSyncStatus('Legalább 2 karakteres, egyedi kódot adj meg.'); return; }
  if (syncCode() && syncCode() !== code && getPending().length) { updateSyncStatus('Előbb várd meg a korábbi mentések feltöltését, mielőtt kódot váltasz.'); return; }
  localStorage.setItem(SYNC_KEY, code);
  updateSyncStatus('☁️ Kód mentve. Az új válaszokat online is rögzítjük.');
  flushPending();
});
function getPending() { try { const a = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch { return []; } }
let flushing = false;
async function flushPending() {
  if (flushing || !syncCode() || !navigator.onLine) return;
  flushing = true;
  try {
    let queue = getPending();
    while (queue.length) {
      const event = queue[0];
      const response = await fetch('/api/stats', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId:syncCode(), sheetName:event.sheetName, result:event.result})});
      if (!response.ok) throw new Error('HTTP '+response.status);
      queue.shift();
      localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
    }
    updateSyncStatus('☁️ Az eredmények online elmentve.');
  } catch (err) { updateSyncStatus('⚠️ Az online mentés még várakozik. Ellenőrizd a kapcsolatot és a Cloudflare oldalt.'); console.warn(err); }
  finally { flushing = false; }
}
window.addEventListener('online', flushPending);
window.addEventListener('focus', flushPending);
flushPending();

const $ = id => document.getElementById(id);
let sheets = [];
let active = null;
let current = null;
let flipped = false;
let retryQueue = [];
let touchStart = null;
let suppressClick = false;
let pending = [];
let roundRetry = [];
let roundCards = [];
let roundKnown = new Set();
let roundMissed = new Set();
// Minden Excel-munkalap saját, harmonikus pasztell kártyaszíneket kap.
// A két szín egy munkalapon belül a kártya elejéhez és hátuljához tartozik.
const SHEET_COLORS = [
  ['#F1DFE2', '#E5DFF3'], // púderrózsa – levendula
  ['#F9E4D6', '#F5EBD7'], // barack – vanília
  ['#DFE9DE', '#DCEDE8'], // zsálya – menta
  ['#DFEAF3', '#E9E1F5'], // púderkék – levendula
  ['#F4E2EA', '#F5E8D8'], // rózsaszín – bézs
  ['#E8E2F3', '#E1EAF0'], // orgona – felhőkék
  ['#F3E8D9', '#E6EBDD'], // homok – pisztácia
  ['#F0DDE5', '#E4E6F5'], // mályva – halványkék
  ['#E2ECE8', '#F3E3DC'], // menta – barackrózsa
  ['#F2E6D9', '#E9E2ED']  // krém – lila
];
function setSheetColors(index) {
  const [front, back] = SHEET_COLORS[index % SHEET_COLORS.length];
  const card = $('card');
  card.style.setProperty('--card-front', front);
  card.style.setProperty('--card-back', back);
  card.style.setProperty('--card-front-border', front);
  card.style.setProperty('--card-back-border', back);
}
let orderMode = localStorage.getItem('studyflow-order') === 'sequential' ? 'sequential' : 'random';
$('order').checked = orderMode === 'random';
function shuffle(items) {
  const a = [...items];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function beginRound(cards) {
  roundCards = [...cards];
  roundKnown = new Set();
  roundMissed = new Set();
  pending = orderMode === 'random' ? shuffle(cards) : [...cards];
  current = null;
  $('roundSummary').classList.add('hidden');
  showCard();
}
function buildQueue() {
  if (!active) return;
  const learned = learnedSet(active);
  beginRound(active.cards.filter(c => !learned.has(c.id)));
}
function advanceCard() {
  current = pending.shift() || null;
}
function showRoundSummary() {
  current = null;
  $('study').classList.add('hidden');
  $('message').classList.add('hidden');
  $('knownCount').textContent = String(roundKnown.size);
  $('missedCount').textContent = String(roundMissed.size);
  $('retryMissed').disabled = roundMissed.size === 0;
  $('roundSummary').classList.remove('hidden');
  $('stats').textContent = `${active.name} · ${roundCards.length} kártyát átnéztél`;
}

function hashText(text) {
  // Stabil azonosító a munkalapnév + szó + jelentés alapján.
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}
function keyFor(sheet) { return STORAGE_PREFIX + encodeURIComponent(sheet.name); }
function learnedSet(sheet) {
  try { const a = JSON.parse(localStorage.getItem(keyFor(sheet)) || '[]'); return new Set(Array.isArray(a) ? a : []); }
  catch { return new Set(); }
}
function saveLearned(sheet, set) {
  try { localStorage.setItem(keyFor(sheet), JSON.stringify([...set])); return true; }
  catch { showMessage('A böngésző nem engedte menteni a haladást. Ellenőrizd a tárhelybeállításokat.', true); return false; }
}
function showMessage(text, error = false) {
  $('study').classList.add('hidden'); $('roundSummary').classList.add('hidden'); $('message').classList.remove('hidden');
  $('message').classList.toggle('error', error); $('message').textContent = text;
}
function showCard() {
  if (!active) return;
  if (!current) advanceCard();
  if (!current) {
    if (roundCards.length) showRoundSummary();
    else {
      $('stats').textContent = `${active.name} · ${active.cards.length} összesen`;
      showMessage('Már minden kártyát megtanultál. Az Újrakezdés gombbal ismételheted az egészet.');
    }
    return;
  }
  const reviewed = roundKnown.size + roundMissed.size;
  $('stats').textContent = `${active.name} · ${reviewed} / ${roundCards.length} átnézve`;
  flipped = false;
  renderCard();
  $('roundSummary').classList.add('hidden');
  $('message').classList.add('hidden');
  $('study').classList.remove('hidden');
  requestAnimationFrame(fitCardWords);
}
function renderCard() {
  if (!current) return;
  $('frontWord').textContent = current.question; // Mindig az Excel A (első) oszlopa
  $('backWord').textContent = current.answer;
  $('card').classList.toggle('is-flipped', flipped);
  $('card').setAttribute('aria-pressed', String(flipped));
  requestAnimationFrame(fitCardWords);
}
// Hosszú szavaknál/kifejezéseknél a kártya magasabb lesz,
// szükség esetén a betűméret is csökken, de legalább 20 px marad.
function fitCardWords() {
  const scene = $('card');
  if (!current || !$('study') || $('study').classList.contains('hidden')) return;
  const mobile = window.matchMedia('(max-width:460px)').matches;
  const baseHeight = mobile ? 270 : 310;
  const maxHeight = 580;
  scene.style.height = baseHeight + 'px';
  const words = [$('frontWord'), $('backWord')];
  for (const word of words) word.style.fontSize = '44px';
  // Először növeljük a kártyát, majd szükség esetén csökkentjük a betűt.
  for (let height = baseHeight; height <= maxHeight; height += 20) {
    scene.style.height = Math.min(height, maxHeight) + 'px';
    if (words.every(word => word.scrollHeight <= word.parentElement.clientHeight - 52 && word.scrollWidth <= word.clientWidth + 2)) return;
  }
  for (let font = 42; font >= 20; font -= 2) {
    for (const word of words) word.style.fontSize = font + 'px';
    if (words.every(word => word.scrollHeight <= word.parentElement.clientHeight - 52 && word.scrollWidth <= word.clientWidth + 2)) return;
  }
  // Szélsőségesen hosszú szövegnél a teljes tartalomnak hagyjunk helyet.
  scene.style.height = Math.max(maxHeight, ...words.map(w => w.scrollHeight + 64)) + 'px';
}
function flip() { if (current) { flipped = !flipped; renderCard(); } }
window.addEventListener('resize', () => { if (current) requestAnimationFrame(fitCardWords); });
// Napi gyakorlási események: a korábbi megtanult jelölésektől függetlenül tároljuk.
function recordPractice(kind) {
  try {
    const raw = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
    const history = raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {};
    const d = new Date();
    const day = [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-');
    const entry = history[day] && typeof history[day] === 'object' ? history[day] : {known:0,missed:0,sheets:{}};
    entry.known = (Number(entry.known)||0) + (kind === 'learn' ? 1 : 0);
    entry.missed = (Number(entry.missed)||0) + (kind === 'again' ? 1 : 0);
    if (!entry.sheets || typeof entry.sheets !== 'object') entry.sheets = {};
    const name = active.name;
    const sh = entry.sheets[name] || {known:0,missed:0};
    sh.known = (Number(sh.known)||0) + (kind === 'learn' ? 1 : 0);
    sh.missed = (Number(sh.missed)||0) + (kind === 'again' ? 1 : 0);
    entry.sheets[name] = sh;
    history[day] = entry;
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  } catch (err) { console.warn('A statisztika mentése nem sikerült:', err); }
}
function next(kind) {
  if (!current || !active) return;
  if (kind === 'learn') {
    const set = learnedSet(active); set.add(current.id);
    if (!saveLearned(active, set)) return;
    roundKnown.add(current.id);
  } else {
    roundMissed.add(current.id);
  }
  recordPractice(kind);
  if (syncCode()) {
    const queue = getPending();
    queue.push({sheetName:active.name, result:kind === 'learn' ? 'known' : 'missed'});
    localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
    flushPending();
  }
  current = null;
  showCard();
}
function restartAll() {
  if (!active) return;
  try { localStorage.removeItem(keyFor(active)); }
  catch { showMessage('Nem sikerült törölni a mentett haladást.', true); return; }
  beginRound(active.cards);
}
$('retryMissed').addEventListener('click', () => {
  if (!active) return;
  const missed = active.cards.filter(c => roundMissed.has(c.id));
  if (missed.length) beginRound(missed);
});
$('restartAll').addEventListener('click', restartAll);
function selectSheet(index) {
  setSheetColors(index);
  active = sheets[index] || null; current = null; retryQueue = [];
  roundCards = []; roundKnown = new Set(); roundMissed = new Set();
  $('roundSummary').classList.add('hidden');
  $('reset').disabled = !active;
  if (!active) { showMessage('Nem található munkalap.', true); return; }
  if (!active.cards.length) {
    $('stats').textContent = `${active.name} · 0 tanulókártya`;
    showMessage('Ez a munkalap még nem tartalmaz tanulható szópárokat. Az első sor legyen fejléc, az A és B oszlopban pedig legyenek szavak.');
    return;
  }
  buildQueue();
}
async function loadExcel() {
  $('reload').disabled = true;
  $('category').disabled = true;
  showMessage('Excel-adatok betöltése…');
  $('stats').textContent = '';
  try {
    if (typeof XLSX === 'undefined') throw new Error('Az Excel-olvasó könyvtár nem töltődött be. Ellenőrizd az internetkapcsolatot.');
    const url = EXCEL_FILE + '?v=' + Date.now();
    const response = await fetch(url, {cache:'no-store'});
    if (!response.ok) throw new Error(`Nem sikerült megnyitni a(z) ${EXCEL_FILE} fájlt (HTTP ${response.status}). Ellenőrizd, hogy az index.html mellett van-e, pontosan ezzel a névvel.`);
    const bytes = await response.arrayBuffer();
    const workbook = XLSX.read(bytes, {type:'array'});
    const parsed = workbook.SheetNames.map(name => {
      const rows = XLSX.utils.sheet_to_json(workbook.Sheets[name], {header:1, defval:'', blankrows:false});
      const seen = new Map();
      const cards = [];
      for (const row of rows.slice(1)) {
        const question = String(row[0] ?? '').trim();
        const answer = String(row[1] ?? '').trim();
        if (!question || !answer) continue;
        const base = hashText(JSON.stringify([name, question, answer]));
        const count = (seen.get(base) || 0) + 1;
        seen.set(base, count);
        cards.push({id:base + ':' + count, question, answer});
      }
      return {name, cards};
    }); // Minden Excel-munkalap látszik a választóban, az üresek is.
    if (!parsed.length) throw new Error('Az Excel-fájlban nem található munkalap.');
    const previousName = active?.name;
    sheets = parsed;
    $('category').replaceChildren();
    sheets.forEach((sheet, i) => {
      const opt = document.createElement('option'); opt.value = String(i);
      opt.textContent = `${sheet.name} (${sheet.cards.length})`;
      $('category').appendChild(opt);
    });
    const selectedIndex = Math.max(0, sheets.findIndex(s => s.name === previousName));
    $('category').value = String(selectedIndex);
    $('category').disabled = false;
    selectSheet(selectedIndex);
  } catch (err) {
    active = null; current = null; $('reset').disabled = true;
    showMessage('Hiba: ' + (err instanceof Error ? err.message : String(err)), true);
  } finally { $('reload').disabled = false; }
}
$('order').addEventListener('change', e => {
  orderMode = e.target.checked ? 'random' : 'sequential';
  try { localStorage.setItem('studyflow-order', orderMode); } catch {}
  buildQueue();
});
$('category').addEventListener('change', e => selectSheet(Number(e.target.value)));
$('reload').addEventListener('click', loadExcel);
$('reset').addEventListener('click', () => {
  if (!active) return;
  if (confirm(`Biztosan törlöd a(z) „${active.name}” munkalap megtanult jelöléseit ezen az eszközön?`)) {
    try { localStorage.removeItem(keyFor(active)); }
    catch { showMessage('Nem sikerült törölni a mentett haladást.', true); return; }
    current = null; retryQueue = []; buildQueue();
  }
});
$('card').addEventListener('click', () => { if (suppressClick) { suppressClick = false; return; } flip(); });
$('card').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); next('again'); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); next('learn'); }
});
$('again').addEventListener('click', () => next('again'));
$('learned').addEventListener('click', () => next('learn'));
$('card').addEventListener('touchstart', e => {
  if (e.touches.length === 1) touchStart = {x:e.touches[0].clientX, y:e.touches[0].clientY};
}, {passive:true});
$('card').addEventListener('touchend', e => {
  if (!touchStart || !e.changedTouches.length) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  touchStart = null;
  if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.3) {
    e.preventDefault();
    suppressClick = true;
    next(dx > 0 ? 'learn' : 'again');
  }
}, {passive:false});
loadExcel();
