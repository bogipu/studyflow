<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Planner – Naptár ♡</title><link rel="stylesheet" href="style.css"></head><body><main><div class="topline"><a class="back" href="index.html">← Főoldal</a><a class="back" href="feladatok.html">☑️ Feladatok</a></div><header class="hero"><div class="eyebrow">MY PLANNER 🎀</div><h1>Naptár ♡</h1><p>Programok, ZH-k és minden fontos dátum 🌷</p></header><section class="panel"><div class="topline"><div class="actions"><button id="prev">‹</button><button id="next">›</button></div><h2 id="monthTitle"></h2><div class="tabs" style="margin:0"><button data-view="month" class="active">Havi</button><button data-view="week">Heti</button><button data-view="day">Napi</button></div></div><div id="calendar"></div><div class="small muted" style="margin-top:12px">🌸 Teendő · 🌿 Tanulás · 💜 Program · ❤️ ZH · 💛 Határidő</div></section><section class="panel"><h2 id="selectedTitle">Kiválasztott nap</h2><div id="dayItems"></div></section><section class="panel"><h2>Új naptári esemény ♡</h2><form id="eventForm" class="form"><label class="full">Megnevezés<input name="title" maxlength="180" required placeholder="Pl. Konzultáció"></label><label>Dátum<input name="date" type="date" required></label><label>Típus<select name="type"><option value="event">Program</option><option value="exam">ZH (automatikus felkészüléssel)</option><option value="deadline">Határidő</option><option value="task">Teendő</option><option value="study">Tanulás</option></select></label><label>Időpont (opcionális)<input name="time" type="time"></label><label>Tanulási idő (perc)<input name="minutes" type="number" min="1" max="600" value="25"></label><button type="submit">＋ Hozzáadás</button></form></section><p class="muted small" id="syncStatus" role="status"></p></main><script src="planner.js"></script></body></html>
