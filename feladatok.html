<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Planner – Feladatok ♡</title><link rel="stylesheet" href="style.css"></head><body class="tasks-page"><main><div class="topline"><a class="back" href="index.html">← Főoldal</a><a class="back" href="naptar.html">📅 Naptár</a></div><header class="hero"><div class="eyebrow">MY PLANNER 🎀</div><h1>Feladataim ♡</h1><p>Apró lépések, nagy haladás 🌷</p></header><section class="panel"><div class="tabs"><button data-tab="today" class="active">Ma</button><button data-tab="week">Ez a hét</button><button data-tab="missed">Elmaradások</button><button data-tab="all">Összes</button></div><div id="taskCategoryFilters" class="task-category-filters" aria-label="Kategóriák szűrése"><label><input type="checkbox" value="task" checked> 🌸 Teendő</label><label><input type="checkbox" value="study" checked> 🌿 Tanulás</label><label><input type="checkbox" value="event" checked> 💜 Program</label><label><input type="checkbox" value="exam" checked> ❤️ ZH</label><label><input type="checkbox" value="deadline" checked> 🧡 Határidő</label><label><input type="checkbox" value="bblooms" checked> 🌺 Bblooms</label><label><input type="checkbox" value="university" checked> 🎓 Egyetem</label></div><label class="show-completed-toggle" style="display:inline-flex;align-items:center;gap:9px;margin:12px 0 16px;cursor:pointer;color:#5D536B;font-weight:600"><input type="checkbox" id="showCompletedTasks" style="width:19px;height:19px;accent-color:#A89BC7"> Elvégzett feladatok mutatása</label><div id="tasks"></div></section><section class="panel"><h2>Új bejegyzés ♡</h2><form id="taskForm" class="form"><label class="full">Megnevezés<input name="title" maxlength="180" required placeholder="Pl. Biológia ismétlés"></label><label>Dátum<input name="date" type="date" required></label><label>Típus<select name="type"><option value="task">Teendő</option><option value="study">Tanulás</option><option value="event">Program</option><option value="exam">ZH</option><option value="deadline">Határidő</option><option value="bblooms">Bblooms 🌸</option><option value="university">Egyetem 🎓</option></select></label><label>Időpont (nem kötelező)<input name="time" type="time"></label><label>Ismétlődés<select name="repeat"><option value="none">Nem ismétlődik</option><option value="daily">Naponta</option><option value="weekly">Hetente</option><option value="monthly">Havonta</option></select></label><label>Ismétlődés vége (ismétlődésnél kötelező)<input name="repeatUntil" type="date"></label><label>Tanulás percekben (opcionális)<input name="minutes" type="number" min="1" max="600" placeholder="25"></label><button type="submit">＋ Hozzáadás</button></form></section><section class="panel"><h2>Automatikus ZH-felkészülés 🎀</h2><p class="muted">A ZH rögzítésekor az előző 7 nap mindegyikére automatikusan készül egy tanulási alkalom.</p><form id="examForm" class="form"><label class="full">ZH neve<input name="title" maxlength="180" required placeholder="Pl. Biológia ZH"></label><label>ZH dátuma<input name="date" type="date" required></label><label>ZH időpontja<input name="time" type="time"></label><label>Napi tanulás (perc)<input name="minutes" type="number" min="1" max="600" value="25" required></label><label>Tanulás időpontja<input name="studytime" type="time" value="18:00" required></label><button type="submit">✨ ZH és 7 tanulási alkalom létrehozása</button></form></section><p class="muted small" id="syncStatus" role="status"></p></main><script src="planner.js"></script><style>
/* Kizárólag a Feladataim oldal elvégzett bejegyzéseinek megjelenítése. */
body.tasks-page:not(.show-completed-tasks) #tasks .task.done { display: none !important; }
</style>
<script>
/* Önálló kapcsoló: nem módosítja a közös planner.js-t vagy a naptárat. */
(function () {
  const toggle = document.getElementById('showCompletedTasks');
  if (!toggle) return;
  function update() {
    document.body.classList.toggle('show-completed-tasks', toggle.checked);
  }
  toggle.addEventListener('change', update);
  update();
})();
</script>
</body></html>
