<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kívánságlistám ♡ – StudyFlow</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#694e62;background:#fcf8fb}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:24px 16px 80px}.hero{background:linear-gradient(120deg,#ffeaf3,#f2eafb);border:1px solid #f0dfe9;border-radius:26px;padding:25px;margin:18px 0 22px}.hero h1{color:#925a79;margin:7px 0}.hero p,.muted{color:#9b8193}.panel{background:#fff;border:1px solid #f1e1eb;border-radius:22px;padding:21px;margin:16px 0;box-shadow:0 8px 24px #885d7609}h2{color:#875574;font-size:1.15rem;margin:0 0 16px}button,input,textarea,select{font:inherit}button{cursor:pointer;background:#f0d3e2;color:#70475f;border:0;border-radius:13px;padding:10px 14px;font-weight:650}button:hover{filter:brightness(.97)}input,textarea,select{border:1px solid #e8d3df;background:#fff;border-radius:12px;padding:10px;width:100%;color:#694e62}label{display:grid;gap:6px;color:#886d80;font-size:.87rem}.form{display:grid;gap:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#fff9fc;border:1px solid #f1dfeb;border-radius:17px;padding:15px}.back{display:inline-block;background:#f2e4ed;border-radius:12px;padding:10px 13px;text-decoration:none;color:#805a70;font-weight:650}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}.pill{border-radius:99px;padding:8px 12px;background:#f9eaf3;color:#815e75}.tiny{font-size:.79rem;color:#a0889b}.danger{background:#fae9ec;color:#9b5265}.meter{height:12px;border-radius:99px;background:#f0e4ec;overflow:hidden;margin-top:9px}.fill{height:100%;background:linear-gradient(90deg,#eba4c7,#bba9e6)}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.day{min-height:58px;border-radius:12px;border:1px solid #f0e2eb;background:#fff9fc;text-align:center;padding:8px 2px;font-size:.85rem}.day.active{background:#f8dbea;border-color:#df9cbe}.day small{display:block;font-size:1.2rem;margin-top:3px}.weekday{text-align:center;color:#9c8295;font-size:.8rem}.muted-box{background:#fff7fb;padding:13px;border-radius:14px}.item{border-bottom:1px solid #f4e9f0;padding:12px 0}.item:last-child{border:0}a{color:#925a79}@media(max-width:520px){.panel{padding:15px}.day{min-height:49px;font-size:.73rem}.day small{font-size:1rem}}</style></head><body><main><a class="back" href="index.html">← Vissza a főoldalra</a><header class="hero"><span>🎀 STUDYFLOW ♡</span><h1>🛍️ Kívánságlistám ♡</h1><p>Egy kis hely az álmaidnak. ♡</p></header><section class="panel"><h2>🛍️ Új kívánságom</h2><form class="form" id="wishForm"><label>Mit szeretnél?<input id="wishName" required maxlength="120" placeholder="Pl. egy szép könyv"></label><div class="grid"><label>Ár (Ft)<input id="wishPrice" type="number" min="0" step="1" required></label><label>Link (nem kötelező)<input id="wishUrl" type="url" placeholder="https://..."></label></div><label>Megjegyzés (nem kötelező)<textarea id="wishNote" rows="2" maxlength="400"></textarea></label><button>💗 Kívánság hozzáadása</button></form></section><section class="panel"><h2>🌷 Kívánságaim</h2><div id="wishList"></div></section><p class="tiny">Az adatok csak ebben a böngészőben tárolódnak, és itt maradnak, amíg nem törlöd őket.</p></main><script>const $=id=>document.getElementById(id), today=()=>new Date().toLocaleDateString('sv-SE'), money=n=>Number(n).toLocaleString('hu-HU')+' Ft';function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}const KEY='studyflow-wishlist-v1';let wishes=load(KEY,[]);$('wishForm').onsubmit=e=>{e.preventDefault();const url=$('wishUrl').value.trim();if(url&&!/^https?:\/\//i.test(url)){alert('Csak http vagy https link használható.');return}wishes.push({id:crypto.randomUUID(),name:$('wishName').value.trim(),price:Number($('wishPrice').value),url,note:$('wishNote').value.trim(),done:false});save(KEY,wishes);e.target.reset();render()};function render(){let root=$('wishList');root.replaceChildren();if(!wishes.length)root.append(el('p','muted','Itt várnak majd a kis álmaid! ♡'));wishes.forEach(w=>{let card=el('div','card');card.style.marginBottom='12px';card.append(el('strong','',w.name+(w.done?' ✓':'')));card.append(el('p','',money(w.price)));if(w.note)card.append(el('p','muted',w.note));if(w.url){let a=el('a','', 'Termék megnyitása');a.href=w.url;a.target='_blank';a.rel='noopener noreferrer';card.append(a)}let actions=el('div','row');actions.style.marginTop='12px';let done=el('button','',w.done?'Még kívánom':'Megszereztem ✓'),del=el('button','danger','Törlés');done.onclick=()=>{w.done=!w.done;save(KEY,wishes);render()};del.onclick=()=>{if(confirm('Törlöd ezt a kívánságot?')){wishes=wishes.filter(x=>x.id!==w.id);save(KEY,wishes);render()}};actions.append(done,del);card.append(actions);root.append(card)})}render();</script></body></html>
