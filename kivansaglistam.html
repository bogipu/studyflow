<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f0e8"><title>A mi kívánságlistánk ♡ – StudyFlow</title>
<link rel="icon" type="image/svg+xml" href="kivansaglista-icon.svg">
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#243b55;background:#f5f0e8}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:25px 16px 70px}a{color:#243b55}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #8c9fba;outline-offset:2px}.back{display:inline-block;text-decoration:none;background:#fffdf9;border:1px solid #e6d8c5;border-radius:12px;padding:10px 14px;font-weight:650}.hero{text-align:center;padding:35px 12px 27px}.eyebrow{letter-spacing:.22em;font-size:.75rem;color:#886e59;font-weight:750}.hero h1{font-family:Georgia,serif;font-size:clamp(2rem,5vw,3.2rem);margin:12px 0;color:#243b55}.hero p{color:#886e59}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 25px}.filter{border:1px solid #e6d8c5;background:#fffdf9;color:#243b55;border-radius:14px;padding:13px 8px;font-weight:750}.filter.active{background:#243b55;color:white;border-color:#243b55}.filter.bogi.active{background:#d9bfa3;color:#243b55;border-color:#c5a685}.filter.balazs.active{background:#b4c8dc;color:#243b55;border-color:#93afca}.sectionhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:10px 0 16px}.sectionhead h2{font-size:1.2rem;margin:0}.muted{color:#886e59;font-size:.9rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px}.wish{background:#fffdf9;border:1px solid #e4d6c4;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:11px;box-shadow:0 5px 22px #243b5508}.wish[data-owner="bogi"]{border-color:#d9bfa3}.wish[data-owner="balazs"]{border-color:#b4c8dc}.wish[data-owner="both"]{border-color:#8797a8}.pill{align-self:flex-start;font-size:.76rem;font-weight:750;border-radius:50px;padding:6px 11px;background:#eae5dc}.wish[data-owner="bogi"] .pill{background:#f1e2d2}.wish[data-owner="balazs"] .pill{background:#dce6f0}.picture{height:126px;border-radius:14px;background:#eee8dd;display:grid;place-items:center;font-size:3rem;overflow:hidden}.wish[data-owner="bogi"] .picture{background:#f3e7d9}.wish[data-owner="balazs"] .picture{background:#e3ebf2}.picture img{width:100%;height:100%;object-fit:cover}.wish h3{margin:0;font-size:1rem;overflow-wrap:anywhere}.price{color:#886e59;font-weight:700}.note{font-size:.87rem;color:#776c63;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto}.actions button,.actions a{border:0;border-radius:10px;padding:9px 11px;background:#f1eae0;color:#243b55;text-decoration:none;font-weight:650;font-size:.82rem}.actions .delete{background:#f5e7e5}.actions .done{background:#e0e9df}.primary{background:#243b55;color:#fff;border:0;border-radius:13px;padding:13px 18px;font-weight:750}.addbar{margin:25px 0;text-align:center}.panel{background:#fffdf9;border:1px solid #e4d6c4;border-radius:20px;padding:20px;margin:18px 0}.panel h2{margin-top:0;font-family:Georgia,serif}.form{display:grid;gap:13px}.form label{display:grid;gap:6px;color:#615447;font-size:.88rem;font-weight:650}.form input,.form textarea,.form select{width:100%;background:white;border:1px solid #d9c9b5;border-radius:11px;padding:11px;color:#243b55}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formbuttons{display:flex;gap:9px;flex-wrap:wrap}.secondary{border:1px solid #d9c9b5;background:#f5f0e8;color:#243b55;border-radius:12px;padding:12px 16px}.empty{background:#fffdf9;border-radius:16px;padding:24px;text-align:center;color:#886e59}.footer{text-align:center;margin-top:35px;color:#886e59;font-size:.8rem}.hidden{display:none!important}@media(max-width:500px){.formrow{grid-template-columns:1fr}.hero{padding-top:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.wish{padding:10px;gap:8px}.picture{height:100px}.actions button,.actions a{padding:8px}.filters{gap:5px}.filter{font-size:.85rem}}
</style></head><body><main>
<header class="hero"><div class="eyebrow">BOGI &amp; BALÁZS</div><h1>A mi kívánságlistánk ♡</h1><p>Két ember, két kívánságlista, egy helyen.</p></header>
<nav class="filters" aria-label="Kívánságok szűrése"><button type="button" class="filter active" data-filter="all" aria-pressed="true">♡ Mind</button><button type="button" class="filter bogi" data-filter="bogi" aria-pressed="false">🩷 Bogi</button><button type="button" class="filter balazs" data-filter="balazs" aria-pressed="false">💙 Balázs</button></nav>
<section aria-label="Kívánságok"><div class="sectionhead"><h2>Bogi és Balázs kívánságai</h2><span class="muted" id="count"></span></div><div id="list" class="grid"></div><div id="empty" class="empty hidden">Itt várnak majd Bogi és Balázs kívánságai ♡</div></section>
<div class="addbar"><button class="primary" id="openForm" type="button">＋ Új kívánság hozzáadása</button></div>
<section class="panel hidden" id="editor"><h2 id="formTitle">Új kis álom ♡</h2><form class="form" id="wishForm"><label>Kívánság neve<input id="name" maxlength="120" required placeholder="Pl. új társasjáték"></label><div class="formrow"><label>Ár (Ft)<input id="price" type="number" min="0" step="1" placeholder="Pl. 15000"></label><label>Kinek a kívánsága?<select id="owner"><option value="bogi">🩷 Bogi</option><option value="balazs">💙 Balázs</option></select></label></div><div class="formrow"><label>Emoji<input id="emoji" maxlength="12" placeholder="🎁"></label><label>Termékkép URL (nem kötelező)<input id="image" type="url" placeholder="https://..."></label></div><label>Terméklink (nem kötelező)<input id="url" type="url" placeholder="https://..."></label><label>Megjegyzés<textarea id="note" maxlength="500" rows="3" placeholder="Miért szeretném? ♡"></textarea></label><div class="formbuttons"><button class="primary" type="submit">♡ Kívánság mentése</button><button class="secondary" type="button" id="cancel">Mégse</button></div></form></section>
<footer class="footer">B &amp; B · our little wishlist ♡<p>Az adatok a StudyFlow adatbázisában tárolódnak, minden eszközön elérhetők.</p></footer>
</main><script>
'use strict';
const KEY='studyflow-wishlist-v1', $=id=>document.getElementById(id);let wishes=[],filter='all',editing=null;
async function api(method='GET',item=null,id=''){
 const response=await fetch('/api/wishlist'+(id?'?id='+encodeURIComponent(id):''),{method,credentials:'same-origin',headers:method==='POST'?{'Content-Type':'application/json'}:{},body:method==='POST'?JSON.stringify(item):undefined});
 const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Nem sikerült kapcsolódni az adatbázishoz.');return data;
}
async function reload(){try{const data=await api();wishes=data.items;render()}catch(e){alert(e.message)}}
async function saveItem(w){try{await api('POST',w);await reload();return true}catch(e){alert('Nem sikerült menteni: '+e.message);return false}}
async function deleteItem(id){try{await api('DELETE',null,id);await reload()}catch(e){alert('Nem sikerült törölni: '+e.message)}}
async function importOld(){
 let old=[];try{old=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}
 if(!Array.isArray(old)||!old.length)return;
 if(!confirm('Találtam '+old.length+' korábbi kívánságot ebben a böngészőben. Átmásoljam őket a közös online listába?'))return;
 let copied=0;for(const w of old){if(!['bogi','balazs'].includes(w.owner))continue;if(wishes.some(x=>x.id===w.id))continue;if(await saveItem(w))copied++}
 if(copied){localStorage.removeItem(KEY);alert(copied+' kívánság átmásolva az online listába.')}else alert('Nem történt átmásolás. A régi adatok megmaradtak.');
}

function node(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function safeUrl(raw){try{const u=new URL(raw);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
function money(v){return v===''||v===null||v===undefined?'Ár nélkül':Number(v).toLocaleString('hu-HU')+' Ft'}
function render(){document.querySelectorAll('[data-filter]').forEach(b=>{const active=b.dataset.filter===filter;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});const shown=wishes.filter(w=>filter==='all'||w.owner===filter);$('count').textContent=shown.length+' kívánság';$('list').replaceChildren();$('empty').classList.toggle('hidden',shown.length!==0);shown.forEach(w=>{const card=node('article','wish');card.dataset.owner=w.owner;card.append(node('span','pill',w.owner==='bogi'?'🩷 Bogi':w.owner==='balazs'?'💙 Balázs':'♡ Korábban közös'));const pic=node('div','picture');const img=safeUrl(w.image);if(img){const im=node('img');im.src=img;im.alt=w.name;im.loading='lazy';im.onerror=()=>pic.replaceChildren(node('span','',w.emoji||'🎁'));pic.append(im)}else pic.append(node('span','',w.emoji||'🎁'));card.append(pic,node('h3','',w.name),node('div','price',money(w.price)));if(w.note)card.append(node('p','note',w.note));const actions=node('div','actions');const done=node('button',w.done?'done':'',w.done?'✓ Megvan!':'♡ Szeretném');done.type='button';done.onclick=async()=>{await saveItem({...w,done:!w.done})};actions.append(done);const url=safeUrl(w.url);if(url){const link=node('a','','Megnézem ↗');link.href=url;link.target='_blank';link.rel='noopener noreferrer';actions.append(link)}const edit=node('button','','Szerkesztés');edit.type='button';edit.onclick=()=>openEditor(w);actions.append(edit);const del=node('button','delete','Törlés');del.type='button';del.onclick=()=>{if(confirm('Biztosan törlöd ezt a kívánságot?')){deleteItem(w.id)}};actions.append(del);card.append(actions);$('list').append(card)})}
function openEditor(w=null){editing=w?.id??null;$('formTitle').textContent=w?'Kívánság szerkesztése ♡':'Új kis álom ♡';$('name').value=w?.name??'';$('price').value=w?.price??'';$('owner').value=w?.owner==='balazs'?'balazs':'bogi';$('emoji').value=w?.emoji??'';$('image').value=w?.image??'';$('url').value=w?.url??'';$('note').value=w?.note??'';$('editor').classList.remove('hidden');$('editor').scrollIntoView({behavior:'smooth',block:'start'})}
$('openForm').onclick=()=>openEditor();$('cancel').onclick=()=>{$('editor').classList.add('hidden');editing=null};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});$('wishForm').onsubmit=async e=>{e.preventDefault();const name=$('name').value.trim(),price=$('price').value,owner=$('owner').value,image=$('image').value.trim(),url=$('url').value.trim();if(!name)return;if((image&&!safeUrl(image))||(url&&!safeUrl(url))){alert('Csak http vagy https link használható.');return}const data={name,price:price===''?'':Number(price),owner,emoji:$('emoji').value.trim()||'🎁',image,url,note:$('note').value.trim()};const old=editing?wishes.find(x=>x.id===editing):null;const item={id:old?.id||(typeof crypto.randomUUID==='function'?crypto.randomUUID():String(Date.now())+Math.random()),...data,done:old?.done||false};if(await saveItem(item)){filter='all';$('editor').classList.add('hidden');editing=null;render()}};reload().then(importOld);
</script></body></html>
