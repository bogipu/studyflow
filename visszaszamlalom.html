<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf7f9"><title>Visszaszámlálóm ♡ – StudyFlow</title><link rel="stylesheet" href="style.css">
<style>
.count-page{background:linear-gradient(145deg,#fff9fc,#f8eff4);min-height:100vh;color:#513d49;font-family:inherit}.count-wrap{max-width:920px;margin:auto;padding:24px 18px 65px}.count-back{display:inline-block;margin-bottom:20px;color:#a4547a;text-decoration:none;font-weight:700}.count-hero{text-align:center;background:#fff;border:1px solid #f0d9e5;border-radius:27px;padding:34px 20px;box-shadow:0 10px 30px #a65d8210}.count-eyebrow{letter-spacing:2px;font-size:12px;color:#a65d81;font-weight:700}.count-hero h1{font-size:clamp(28px,5vw,44px);margin:12px 0}.count-sub{color:#947485;margin:0 0 23px}.count-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.count-stat{background:#fff3f8;border-radius:18px;padding:18px 7px}.count-stat strong{display:block;color:#ad6286;font-size:clamp(23px,5vw,38px)}.count-stat span{font-size:13px}.count-track{height:13px;background:#f2e3eb;border-radius:20px;overflow:hidden;margin:23px 0 9px}.count-fill{height:100%;background:linear-gradient(90deg,#d99bb7,#b86e94);width:0%;transition:width .2s}.count-progress{font-size:14px;color:#936e82}.count-section{background:white;border:1px solid #f0d9e5;border-radius:24px;padding:24px;margin-top:22px}.count-section h2{margin:0 0 8px;font-size:23px}.count-note{color:#927888;font-size:14px}.count-form{display:grid;grid-template-columns:1fr 190px auto;gap:10px;margin-top:20px}.count-form input{box-sizing:border-box;min-width:0;border:1px solid #e7cad9;border-radius:12px;padding:12px;font:inherit;background:#fff}.count-button{border:0;background:#b66b91;color:#fff;padding:12px 16px;border-radius:12px;cursor:pointer;font:inherit;font-weight:700}.count-button:hover{background:#a2597e}.count-list{display:grid;gap:12px;margin-top:18px}.count-item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;background:#fff8fb;border:1px solid #f0dce6;border-radius:17px;padding:14px}.count-item .count-event-track{flex-basis:100%;width:100%;height:10px;background:#f2e3eb;border-radius:20px;overflow:hidden;margin-top:2px}.count-item .count-event-fill{height:100%;background:linear-gradient(90deg,#d99bb7,#b86e94);border-radius:20px;transition:width .2s}.count-item strong{display:block;overflow-wrap:anywhere}.count-item small{color:#927888}.count-right{text-align:right;flex-shrink:0}.count-days{font-size:22px;font-weight:800;color:#a75e84}.count-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}.count-small{background:#f4e2ec;color:#85526c;border:0;border-radius:9px;padding:6px 9px;cursor:pointer}.count-message{min-height:20px;color:#a05272;font-size:14px;margin-top:12px}@media(max-width:650px){.count-form{grid-template-columns:1fr}.count-item{align-items:flex-start}.count-stat{padding:12px 5px}.count-stat span{font-size:11px}}
</style></head>
<body class="count-page"><main class="count-wrap"><a class="count-back" href="index.html">← Főoldal</a>
<section class="count-hero"><div class="count-eyebrow">🌷 STUDYFLOW · AZ ÉN IDŐM</div><h1>Visszaszámlálóm ♡</h1><p class="count-sub">2026. szeptember 7. – 2027. január 31. | Minden nappal közelebb.</p><div class="count-grid"><div class="count-stat"><strong id="remaining">–</strong><span>nap hátra</span></div><div class="count-stat"><strong id="weeks">–</strong><span>teljes hét hátra</span></div><div class="count-stat"><strong id="percent">–</strong><span>eltelt</span></div></div><div class="count-track" role="progressbar" aria-label="Szemeszter haladása" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack"><div class="count-fill" id="progressFill"></div></div><div class="count-progress" id="progressText"></div></section>
<section class="count-section"><h2>🎀 Amiket várok ♡</h2><p class="count-note">Adj hozzá saját eseményeket, és mindegyikhez külön visszaszámlálót kapsz.</p><form class="count-form" id="eventForm"><input id="eventTitle" maxlength="160" placeholder="Pl. Utazás, vizsga vége…" aria-label="Esemény neve" required><input id="eventDate" type="date" aria-label="Esemény dátuma" required><button class="count-button" type="submit">＋ Hozzáadás</button></form><p id="message" class="count-message" role="status"></p><div id="eventList" class="count-list"></div></section></main><script src="studyflow-session.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),DAY=86400000,START='2026-09-07',END='2027-01-31';let events=[];
function ordinal(s){const [y,m,d]=s.split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/DAY)}
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function distance(date){return ordinal(date)-ordinal(today())}
function niceDate(date){return new Intl.DateTimeFormat('hu-HU',{year:'numeric',month:'long',day:'numeric'}).format(new Date(date+'T12:00:00'))}
function message(text){$('message').textContent=text}
function renderClock(){const total=ordinal(END)-ordinal(START),elapsed=Math.max(0,Math.min(total,ordinal(today())-ordinal(START))),left=Math.max(0,ordinal(END)-ordinal(today()));const percent=Math.round(elapsed/total*100);$('remaining').textContent=left;$('weeks').textContent=Math.floor(left/7);$('percent').textContent=percent+'%';$('progressFill').style.width=percent+'%';$('progressTrack').setAttribute('aria-valuenow',percent);$('progressText').textContent=ordinal(today())<ordinal(START)?'Hamarosan kezdődik ♡':left===0?'Elérkeztél a célhoz! ♡':`${elapsed} nap eltelt a ${total} napból ♡`}
function renderEvents(){const host=$('eventList');host.replaceChildren();if(!events.length){const p=document.createElement('p');p.className='count-note';p.textContent='Még nincs saját eseményed. ♡';host.append(p);return}for(const e of [...events].sort((a,b)=>a.date.localeCompare(b.date))){const row=document.createElement('article');row.className='count-item';const info=document.createElement('div'),title=document.createElement('strong'),date=document.createElement('small');title.textContent=e.title;date.textContent=niceDate(e.date);info.append(title,date);const right=document.createElement('div');right.className='count-right';const days=document.createElement('div');days.className='count-days';const left=distance(e.date);days.textContent=left>0?left+' nap':left===0?'Ma! ♡':'Már elmúlt ♡';const actions=document.createElement('div');actions.className='count-actions';for(const [label,action] of [['✎ Szerkesztés','edit'],['✕ Törlés','delete']]){const b=document.createElement('button');b.type='button';b.className='count-small';b.textContent=label;b.addEventListener('click',()=>action==='edit'?editEvent(e):deleteEvent(e));actions.append(b)}right.append(days,actions);const track=document.createElement('div');track.className='count-event-track';track.setAttribute('role','progressbar');track.setAttribute('aria-label',e.title+' visszaszámlálásának haladása');track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax','100');const span=Math.max(1,ordinal(e.date)-ordinal(START));const elapsed=ordinal(today())-ordinal(START);const pct=Math.max(0,Math.min(100,Math.round(elapsed/span*100)));track.setAttribute('aria-valuenow',String(pct));const fill=document.createElement('div');fill.className='count-event-fill';fill.style.width=pct+'%';track.append(fill);row.append(info,right,track);host.append(row)}}
async function request(method,payload,id){const url='/api/countdowns'+(id?'?id='+encodeURIComponent(id):'');const options={method,cache:'no-store'};if(payload){options.headers={'Content-Type':'application/json'};options.body=JSON.stringify(payload)}const res=await fetch(url,options);let data={};try{data=await res.json()}catch{}if(!res.ok)throw Error(data.error||'A mentés nem sikerült.');return data}
async function load(){try{const data=await request('GET');events=Array.isArray(data.items)?data.items:[];renderEvents();message('Online szinkronizálás aktív ♡')}catch(err){message('Nem sikerült betölteni az eseményeket: '+err.message)}}
$('eventForm').addEventListener('submit',async ev=>{ev.preventDefault();const title=$('eventTitle').value.trim(),date=$('eventDate').value;if(!title||!date)return;const item={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,date};const button=ev.submitter;button.disabled=true;try{await request('POST',item);events.push(item);renderEvents();$('eventForm').reset();message('Esemény mentve ♡')}catch(err){message(err.message)}finally{button.disabled=false}});
async function editEvent(item){const title=prompt('Esemény neve:',item.title);if(title===null)return;const clean=title.trim();if(!clean||clean.length>160)return alert('Adj meg egy érvényes nevet.');const date=prompt('Dátum (ÉÉÉÉ-HH-NN):',item.date);if(date===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(new Date(date+'T12:00:00').getTime())||new Date(date+'T12:00:00').getDate()!==Number(date.slice(8)))return alert('Érvénytelen dátum.');try{await request('POST',{id:item.id,title:clean,date});item.title=clean;item.date=date;renderEvents();message('Módosítás mentve ♡')}catch(err){message(err.message)}}
async function deleteEvent(item){if(!confirm('Törlöd ezt az eseményt?'))return;try{await request('DELETE',null,item.id);events=events.filter(e=>e.id!==item.id);renderEvents();message('Esemény törölve ♡')}catch(err){message(err.message)}}
$('eventDate').value=today();renderClock();renderEvents();load();setInterval(()=>{renderClock();renderEvents()},60000);
</script></body></html>
