<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf7f9"><title>StudyFlow – Listáim ♡</title><link rel="stylesheet" href="style.css">
<style>
.list-wrap{max-width:950px;margin:0 auto;padding:24px 16px 70px}.list-head{margin:22px 0 26px;text-align:center}.list-head h1{font-size:clamp(2rem,6vw,3rem);margin:10px 0;color:#9e5576}.list-head p{color:#977e8b}.list-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}.list-card{background:#fffafd;border:1px solid #efdbe5;border-radius:24px;padding:22px;box-shadow:0 8px 28px #a36b8c14}.list-card h2{margin:0 0 6px;color:#945775}.list-sub{font-size:.92rem;color:#947d89;margin:0 0 18px}.list-form{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.list-form input{min-width:0;flex:1 1 140px;padding:11px 12px;border-radius:12px;border:1px solid #e4cbd8;background:#fff;color:#5a4250;font:inherit}.list-form .quantity{flex:0 1 100px}.list-form button,.list-actions button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:#b86b90;color:white;font:inherit}.list-actions button{background:#f7e7ee;color:#8c506e;padding:5px 9px}.list-row{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid #f2e6ec}.list-row input[type=checkbox]{width:19px;height:19px;accent-color:#b86b90;flex-shrink:0}.list-label{flex:1;min-width:0;overflow-wrap:anywhere}.list-row.done .list-label{text-decoration:line-through;color:#a99aa2}.list-qty{color:#957b89;font-size:.88rem}.list-actions{display:flex;gap:5px}.list-empty{color:#9a8792;text-align:center;padding:22px 4px}.list-status{min-height:22px;margin-top:16px;color:#8b6378}.list-back{color:#985a7a;text-decoration:none;font-weight:600}
</style></head><body><main class="list-wrap"><a class="list-back" href="index.html">← Főoldal</a><header class="list-head"><h1>Listáim ♡</h1><p>Két kis lista, hogy semmi ne maradjon ki. 🎀</p></header><div class="list-grid">
<section class="list-card"><h2>🧳 Pakolási listám ♡</h2><p class="list-sub">Pipáld ki, ami már a táskádba került.</p><form class="list-form" data-list="packing"><input name="name" aria-label="Pakolandó tétel" placeholder="Mit szeretnél bepakolni?" maxlength="160" required><button type="submit">＋ Hozzáadás</button></form><div id="packingItems"></div></section>
<section class="list-card"><h2>🛒 Bevásárlólistám ♡</h2><p class="list-sub">A megvett termékeket egy pipával jelölheted.</p><form class="list-form" data-list="shopping"><input name="name" aria-label="Termék neve" placeholder="Mit kell megvenni?" maxlength="160" required><input class="quantity" name="quantity" aria-label="Mennyiség" placeholder="Mennyiség" maxlength="60"><button type="submit">＋ Hozzáadás</button></form><div id="shoppingItems"></div></section>
</div><p class="list-status" id="listStatus" role="status"></p></main><script src="studyflow-session.js"></script><script>
'use strict';
const state={items:[]};const byId=id=>document.getElementById(id);const status=msg=>byId('listStatus').textContent=msg;
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(method='GET',payload=null,id=''){
 const res=await fetch('/api/lists'+(id?'?id='+encodeURIComponent(id):''),{method,cache:'no-store',headers:payload?{'Content-Type':'application/json'}:{},body:payload?JSON.stringify(payload):undefined});
 const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'Nem sikerült a mentés.');return data;
}
function render(){for(const type of ['packing','shopping']){
 const target=byId(type+'Items'),items=state.items.filter(item=>item.list===type);
 target.innerHTML=items.length?items.map(item=>`<div class="list-row ${item.done?'done':''}" data-id="${escapeHtml(item.id)}"><input type="checkbox" data-action="toggle" ${item.done?'checked':''} aria-label="${escapeHtml(item.name)} kész"><span class="list-label">${escapeHtml(item.name)}${item.quantity?` <span class="list-qty">(${escapeHtml(item.quantity)})</span>`:''}</span><span class="list-actions"><button type="button" data-action="edit" aria-label="Szerkesztés">✎</button><button type="button" data-action="delete" aria-label="Törlés">✕</button></span></div>`).join(''):'<p class="list-empty">Még nincs itt semmi. ♡</p>';
}}
async function reload(){const data=await api();state.items=Array.isArray(data.items)?data.items:[];render();status('Online mentés aktív ♡')}
document.querySelectorAll('form[data-list]').forEach(form=>form.addEventListener('submit',async e=>{e.preventDefault();const name=form.elements.name.value.trim(),quantity=form.elements.quantity?.value.trim()||'';if(!name)return;try{await api('POST',{id:crypto.randomUUID(),list:form.dataset.list,name,quantity,done:false});form.reset();await reload()}catch(err){status('⚠️ '+err.message)}}));
document.addEventListener('change',async e=>{if(e.target.dataset.action!=='toggle')return;const item=state.items.find(x=>x.id===e.target.closest('[data-id]')?.dataset.id);if(!item)return;try{await api('POST',{...item,done:e.target.checked});await reload()}catch(err){e.target.checked=!e.target.checked;status('⚠️ '+err.message)}});
document.addEventListener('click',async e=>{const button=e.target.closest('button[data-action]');if(!button)return;const item=state.items.find(x=>x.id===button.closest('[data-id]')?.dataset.id);if(!item)return;try{if(button.dataset.action==='delete'){if(!confirm('Biztosan törlöd ezt a tételt?'))return;await api('DELETE',null,item.id)}else if(button.dataset.action==='edit'){const name=prompt('Tétel neve:',item.name);if(name===null)return;if(!name.trim())return status('A név nem lehet üres.');let quantity=item.quantity;if(item.list==='shopping'){quantity=prompt('Mennyiség:',item.quantity||'');if(quantity===null)return}await api('POST',{...item,name:name.trim(),quantity:quantity.trim()})}await reload()}catch(err){status('⚠️ '+err.message)}});
reload().catch(err=>{render();status('⚠️ Nem sikerült betölteni az online listákat: '+err.message)});
</script></body></html>
