<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Belépés ♡ – StudyFlow</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,#fff7fb,#f4efff,#eaf8f7);font-family:system-ui,sans-serif;color:#66526d;padding:20px}.card{background:#fff;border:1px solid #efddea;border-radius:28px;box-shadow:0 14px 45px #9b7aa626;padding:36px;width:min(100%,390px);text-align:center}h1{font-size:29px;margin:10px 0}p{line-height:1.6;color:#88738e}label{display:block;text-align:left;margin:20px 0 8px;font-weight:600}input{width:100%;border:1px solid #dbc6df;border-radius:14px;padding:14px;font-size:16px}button{width:100%;background:#cda2c9;color:#fff;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;margin-top:16px;cursor:pointer}button:disabled{opacity:.6}#msg{min-height:22px;font-size:14px;color:#a34563}</style></head><body><main class="card"><div style="font-size:42px">🌷🧸</div><h1>StudyFlow ♡</h1><p>Egy kis nyugalom, egy kis rend. Lépj be a saját kuckódba a PIN-kódoddal! 💗</p><form id="f"><label for="pw">6 számjegyű PIN-kód</label><input id="pw" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="off" required autofocus><button id="btn">Belépés ♡</button><p id="msg" role="alert"></p></form></main><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('btn'),m=document.getElementById('msg');b.disabled=true;m.textContent='Belépés…';try{const r=await fetch('/api/health-login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Sikertelen belépés');location.replace('/index.html')}catch(err){m.textContent=err.message;b.disabled=false}});</script></body></html>
