<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf7f9"><title>StudyFlow – Mai napom ♡</title><link rel="stylesheet" href="style.css"></head><body class="today-page"><main>
<div class="topline"><a class="back" href="index.html">← Főoldal</a><a class="back" href="feladatok.html">☑️ Feladataim</a><a class="back" href="naptar.html">📅 Naptár</a></div>
<header class="hero"><div class="eyebrow">YOUR COZY DAY 🌷</div><h1>Mai napom ♡</h1><p id="todayDateLabel"></p></header>
<section class="panel"><h2>Mai feladataim ♡</h2><div id="todayTasks"></div></section>
<section class="panel"><div class="timeline-top"><div><h2>Futó projektek ♡</h2><p class="muted small">A színes vonal összeköti a saját mérföldköveidet.</p></div><div class="timeline-nav"><button id="projectPrev" type="button" aria-label="Előző hét">‹</button><button id="projectToday" type="button">Ma</button><button id="projectNext" type="button" aria-label="Következő hét">›</button></div></div><p id="projectWeekLabel" class="muted small"></p><div class="timeline-days" id="timelineDays"></div><div id="projectTimeline"></div></section>
<section class="panel"><div class="timeline-top"><h2 id="projectFormTitle">Új projekt ♡</h2><button id="projectNew" type="button" class="soft-button">＋ Új projekt</button></div><form id="projectForm" class="form"><input type="hidden" name="projectId"><label class="full">Projekt neve<input name="title" maxlength="180" required placeholder="Pl. Ági kertje"></label><label>Kategória<select name="category"><option value="bblooms">Bblooms 🌸</option><option value="university">Egyetem 🎓</option><option value="task">Teendő</option><option value="study">Tanulás</option><option value="event">Program</option><option value="exam">ZH</option><option value="deadline">Határidő</option></select></label><label>Projekt színe<input name="color" type="color" value="#e5b4c9"></label><button type="submit">♡ Projekt mentése</button><button type="button" id="projectDelete" class="danger" hidden>Projekt törlése</button></form></section>
<section class="panel" id="milestonePanel" hidden><h2>Mérföldkövek ♡</h2><p class="muted small">Te nevezed el az állomásokat. Bármennyit hozzáadhatsz, átírhatsz vagy törölhetsz.</p><div id="milestoneList"></div><form id="milestoneForm" class="form"><input type="hidden" name="projectId" id="milestoneProjectId"><input type="hidden" name="milestoneId"><label class="full">Mérföldkő neve<input name="title" maxlength="180" required placeholder="Pl. Kertfelmérés"></label><label>Dátum<input name="date" type="date" required></label><button type="submit">＋ Mérföldkő mentése</button></form></section>
<p id="syncStatus" class="muted small" role="status"></p>
</main><script src="planner.js"></script></body></html>
